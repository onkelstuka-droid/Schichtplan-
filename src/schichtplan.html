<style>
/* Layout: sticky Kopf mit "Heute"-Karte, darunter endloser vertikaler Monats-Feed (Mo–So-Raster), Bottom-Sheets für Aktionen */
:root{

  --frei:#ebe9e4; --today:#1d1f24; --we:#ff8000; --feiertag:#d42a2a; --feiertag-ink:#ffffff;
  --tint-winter:#e4ebf4; --tint-spring:#eef3e6; --tint-summer:#f8efd8; --tint-autumn:#f5e6d6;
  --p-snow:#7896c4; --p-petal:#f2a7c3; --p-sun:#f0b429; --p-leaf1:#d9661f; --p-leaf2:#b8401c; --p-leaf3:#c99a2e; --shadow:0 8px 30px rgba(20,22,28,.14);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121317; --surface:#1b1d22; --fg:#eceae6; --muted:#9a9ea8; --line:#2a2d34;
  --frueh:#e8b90f; --frueh-ink:#2b2200; --spaet:#ec7413; --nacht:#3b7be0; --urlaub:#23a874; --tz:#9467dd; --ag:#5ab8e6; --krank:#a81c1c; --su:#e8a0be; --ue:#1fb8a5;
  --frei:#23252b; --today:#eceae6; --we:#ff8000; --feiertag:#ef4747;
  --tint-winter:#151b26; --tint-spring:#141a14; --tint-summer:#1c1910; --tint-autumn:#1d1510;
  --p-snow:#dfe8f5; --p-petal:#d988a8; --p-sun:#e8b33a; --p-leaf1:#d9661f; --p-leaf2:#a83a1a; --p-leaf3:#b98a24; --shadow:0 8px 30px rgba(0,0,0,.5); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121317; --surface:#1b1d22; --fg:#eceae6; --muted:#9a9ea8; --line:#2a2d34;
  --frueh:#e8b90f; --frueh-ink:#2b2200; --spaet:#ec7413; --nacht:#3b7be0; --urlaub:#23a874; --tz:#9467dd; --ag:#5ab8e6; --krank:#a81c1c; --su:#e8a0be; --ue:#1fb8a5;
  --frei:#23252b; --today:#eceae6; --we:#ff8000; --feiertag:#ef4747;
  --tint-winter:#151b26; --tint-spring:#141a14; --tint-summer:#1c1910; --tint-autumn:#1d1510;
  --p-snow:#dfe8f5; --p-petal:#d988a8; --p-sun:#e8b33a; --p-leaf1:#d9661f; --p-leaf2:#a83a1a; --p-leaf3:#b98a24; --shadow:0 8px 30px rgba(0,0,0,.5); color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html{--tintnow:var(--bg)}
body{overflow-x:hidden}
#season,#seasonFront{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#seasonFront{z-index:4}
.wrap{position:relative;z-index:1}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--tintnow)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--tintnow);padding-block:10px 6px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
.more{display:block;width:100%;margin-top:14px;border:1px dashed var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:12px;font:600 15px var(--f-body);cursor:pointer}
#months{padding-bottom:110px}
.top{display:flex;align-items:center;justify-content:space-between;gap:6px}
h1{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.01em;margin:0;text-transform:uppercase}
h1 small{white-space:nowrap;font-weight:500;color:var(--muted);font-size:15px;letter-spacing:.06em;margin-left:6px}
.iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;height:40px;padding:0 12px;font:600 14px var(--f-body);display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.iconbtn:focus-visible,button:focus-visible{outline:2px solid var(--nacht);outline-offset:2px}
.iconbtn svg{width:18px;height:18px}

.todaycard{flex:1;min-width:0;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 10px 6px 6px}
.badge{width:38px;height:38px;border-radius:10px;font-size:19px!important;display:grid;place-items:center;font:700 22px var(--f-display)}
.todaycard .t1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.todaycard .t2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:600 18px/1.15 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.todaycard .t2 span{font:500 13px var(--f-body);text-transform:none;letter-spacing:0;color:var(--muted)}
.iconbtn.sq{width:44px;height:44px;padding:0;justify-content:center;flex:none;border-radius:14px}
.vac{text-align:right;font-size:12px;color:var(--muted);line-height:1.3}
.budget{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.bud{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:4px 6px;display:flex;align-items:center;gap:4px;min-width:0;font-variant-numeric:tabular-nums}
.bud em{font-style:normal;color:#fff;border-radius:5px;padding:1px 3px;font:700 10.5px var(--f-display);letter-spacing:.04em;flex:none}
.bud b{font:700 18px/1 var(--f-display)}
.bud .r{display:flex;align-items:center;gap:4px}
.bud.yr{justify-content:center;gap:5px}.bud.yr b{font-size:15px}
.bud span{font-size:10px;line-height:1.2;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bud.over b{color:#c43c2c}

.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:500}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:11px;font-weight:600;color:var(--muted);text-align:center;letter-spacing:.06em;text-transform:uppercase}

.month{padding-block:18px 4px}
.month h2{font-family:var(--f-display);font-weight:600;font-size:22px;text-transform:uppercase;letter-spacing:.03em;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline;text-wrap:balance}
.month h2{flex-wrap:wrap;column-gap:10px}
.day.TZ::after,.day.AG::after,.day.SU::after{display:none}
.day.TZ .s,.day.AG .s,.day.SU .s{font-size:13px!important;letter-spacing:0}
.month h2 span{white-space:nowrap;margin-left:auto;font:500 13px var(--f-body);color:var(--muted);text-transform:none;letter-spacing:0}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{position:relative;aspect-ratio:1/1.32;max-width:100%;border:0;border-radius:10px;padding:5px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;cursor:pointer;font-family:var(--f-body);background:var(--frei);color:var(--fg);overflow:hidden}
.day .n{font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.day .s{font:700 15px var(--f-display);letter-spacing:.04em;padding-bottom:5px}
.day.F{background:var(--frueh);color:var(--frueh-ink)}
.day.S{background:var(--spaet);color:var(--spaet-ink)}
.day.N{background:var(--nacht);color:var(--nacht-ink)}
.day.X .s{color:var(--muted);font-weight:500;font-size:12px}
.day.U{background:var(--urlaub);color:var(--urlaub-ink)}
.day.U .s{color:var(--urlaub-ink);font-size:15px;font-weight:700}
.day.TZ{background:var(--tz);color:var(--tz-ink)}
.day.TZ .s{color:var(--tz-ink);font-size:15px;font-weight:700}
.day.AG{background:var(--ag);color:var(--ag-ink)}
.day.AG .s{color:var(--ag-ink);font-size:15px;font-weight:700}
.day.K{background:var(--krank);color:var(--krank-ink)}
.day.K .s{color:var(--krank-ink);font-size:15px;font-weight:700}
.day.SU{background:var(--su);color:var(--su-ink)}
.day.SU .s{color:var(--su-ink);font-size:15px;font-weight:700}
.day.U::after,.day.TZ::after,.day.AG::after,.day.K::after,.day.SU::after{content:attr(data-orig);position:absolute;bottom:5px;right:6px;font:700 10px var(--f-display);opacity:.8}
.day.today{box-shadow:0 0 0 2.5px var(--bg),0 0 0 4.5px var(--today)}
.day.past{opacity:.55}
.day.pick{outline:3px dashed var(--urlaub);outline-offset:1px}
.blank{aspect-ratio:1/1.32}
.day .w{align-self:flex-start;margin-left:6px;font-size:9.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;opacity:.75;line-height:1}
.dow .lf{display:none}
@media (min-width:520px){.dow .lf{display:inline}.dow .sf{display:none}}
.day.F{--frame:var(--frueh)}.day.S{--frame:var(--spaet)}.day.N{--frame:var(--nacht)}.day.U{--frame:var(--urlaub)}.day.TZ{--frame:var(--tz)}.day.AG{--frame:var(--ag)}.day.K{--frame:var(--krank)}.day.SU{--frame:var(--su)}.day.X{--frame:var(--frei)}
.day.ft{background:var(--feiertag);color:var(--feiertag-ink);box-shadow:inset 0 0 0 5px var(--frame)}
.day.ft .s,.day.X.ft .s{color:var(--feiertag-ink);font-weight:700}
.day.ft.today{box-shadow:inset 0 0 0 5px var(--frame),0 0 0 2.5px var(--bg),0 0 0 4.5px var(--today)}
.day.ft.past{opacity:.7}
.day[data-ic]::before{content:attr(data-ic);position:absolute;top:2px;right:3px;font-size:13px;line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.hol .ic{width:18px;text-align:center}
.hol b{color:var(--feiertag)!important}
.hol{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:3px;font-size:13px;color:var(--muted)}
.hol li{display:flex;gap:8px}
.hol b{font-variant-numeric:tabular-nums;color:var(--fg);font-weight:600;min-width:42px}
.lg-ft{font-weight:600;color:var(--feiertag-ink);background:var(--feiertag);border:3px solid var(--spaet);border-radius:5px;padding:0 4px;font-size:11px}
.sentinel{height:1px}

.fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:6;border:0;border-radius:999px;background:var(--fg);color:var(--bg);font:700 15px var(--f-display);letter-spacing:.06em;text-transform:uppercase;padding:13px 20px;box-shadow:var(--shadow);cursor:pointer}

.banner{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--urlaub);color:var(--urlaub-ink);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:600}
.banner button{border:1px solid rgba(255,255,255,.6);background:transparent;color:inherit;border-radius:10px;padding:8px 12px;font:600 14px var(--f-body);cursor:pointer}

.scrim{position:fixed;inset:0;background:rgba(10,12,16,.45);z-index:12}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:13;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:var(--shadow);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px calc(env(safe-area-inset-bottom,0px) + 20px);max-width:560px;margin:0 auto;display:grid;gap:12px;animation:up .2s ease-out;max-height:88%;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);justify-self:center}
.sheet h3{margin:0;font:600 24px var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.sheet p{margin:0;color:var(--muted);line-height:1.45}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:14px;padding:14px;font:600 16px var(--f-body);cursor:pointer;text-align:left;display:flex;justify-content:space-between;align-items:center}
.btn.primary{background:var(--urlaub);border-color:var(--urlaub);color:var(--urlaub-ink)}
.btn.danger{color:#c43c2c}
.btn.tz{background:var(--tz);border-color:var(--tz);color:var(--tz-ink)}
.btn.ty{background:var(--tc);border-color:var(--tc);color:var(--ti)}
.row2>.btn:last-child:nth-child(odd){grid-column:1/-1}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.row3 .btn{justify-content:center}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.colrow{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;border:1px solid var(--line);border-radius:12px;padding:6px 8px;cursor:pointer}
.colrow input{width:34px;height:28px;border:0;padding:0;background:none;flex:none;cursor:pointer}
.btn.half{justify-content:center;text-align:center}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row2 .btn{flex-direction:column;gap:2px}
.sheet h4{margin:4px 0 0;font:600 13px var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
input[type=number]{font:600 18px var(--f-body);padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%}
.btn small{font-weight:500;opacity:.8;font-size:13px}
label.f{display:grid;gap:6px;font-weight:600;font-size:14px}
input[type=date]{font:500 16px var(--f-body);padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%}
.err{color:#c43c2c;font-size:13px;min-height:1em}
.cycle{display:flex;gap:2px;flex-wrap:wrap}
.cycle i{width:calc((100% - 54px)/28);min-width:8px;height:14px;border-radius:3px;background:var(--frei)}
.cycle i.F{background:var(--frueh)}.cycle i.S{background:var(--spaet)}.cycle i.N{background:var(--nacht)}

.chk{display:flex;align-items:center;gap:10px;font-weight:600;padding:12px 14px;border:1px solid var(--line);border-radius:14px;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--urlaub)}
.btn[disabled]{opacity:.45;cursor:default}
.pkbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pkbar strong{font:600 20px var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.pkbar .iconbtn{font-size:22px}
.pk{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.pk .h{text-align:center;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase}
.pkd{border:0;border-radius:8px;height:42px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:var(--frei);color:var(--fg);font-family:var(--f-body);cursor:pointer;position:relative;box-shadow:inset 0 -4px 0 var(--stripe,transparent)}
.pkd b{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.pkd i{font:700 10px var(--f-display);font-style:normal;opacity:.7;min-height:10px}
.pkd.F{--stripe:var(--frueh)}.pkd.S{--stripe:var(--spaet)}.pkd.N{--stripe:var(--nacht)}
.pkd.X{color:var(--muted)}
.pkd.hf{background:var(--feiertag);color:var(--feiertag-ink)}
.pkd.in{background:var(--sel);color:var(--selink);opacity:.75}
.pkd.edge{opacity:1;box-shadow:0 0 0 2px var(--fg)}
.pkinfo{font-size:14px;color:var(--fg)!important;min-height:2.9em}

.yearview{position:fixed;inset:0;z-index:11;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-bottom,0px) + 24px)}
.yvbar{display:flex;align-items:center;gap:8px;max-width:620px;margin:0 auto}
.yvbar strong{font:700 26px var(--f-display);flex:1;text-align:center}

.a4wrap{max-width:620px;margin:0 auto;position:relative;overflow:hidden}

  --frei:#efede8}
.a4head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2.5px solid #1d1f24;padding-bottom:8px}

.a4head small{font-size:14px;color:#6b6f78}
.ygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 24px;align-content:start}

.yg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}

.yd{display:flex;flex-direction:column;align-items:center;justify-content:center;height:25px;border-radius:4px;background:var(--frei);font:700 11px/1 var(--f-display);color:#6b6f78}
.yd b{font:500 9.5px/1.1 var(--f-body);opacity:.85}

.yd.AG{background:var(--ag);color:var(--ag-ink)}.yd.K{background:var(--krank);color:var(--krank-ink)}.yd.SU{background:var(--su);color:var(--su-ink)}
.yd.U{background:var(--urlaub);color:var(--urlaub-ink)}.yd.TZ{background:var(--tz);color:var(--tz-ink)}
.yd.F{--frame:var(--frueh)}.yd.S{--frame:var(--spaet)}.yd.N{--frame:var(--nacht)}.yd.U{--frame:var(--urlaub)}.yd.TZ{--frame:var(--tz)}.yd.AG{--frame:var(--ag)}.yd.K{--frame:var(--krank)}.yd.SU{--frame:var(--su)}.yd.X{--frame:var(--frei)}
.yd.hf{background:var(--feiertag);color:#fff;box-shadow:inset 0 0 0 4.5px var(--frame)}
.yhol .ic{display:inline-block;width:1.4em}
.a4foot{margin-top:auto;display:grid;gap:7px;border-top:1px solid #d8d6d0;padding-top:9px}

.a4foot .sum{font-weight:600;font-size:13px}
.yhol{list-style:none;margin:0;padding:0;columns:3;font-size:11.5px;color:#3a3d44;line-height:1.45}
.yhol b{color:var(--feiertag)}.yhol i{color:#6b6f78}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 80px);z-index:20;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow);text-align:center}
textarea{font:13px/1.4 ui-monospace,Menlo,monospace;width:100%;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);resize:vertical}
.yvbar strong.st{font-size:22px;white-space:nowrap}
.sbody{max-width:620px;margin:0 auto;display:grid;gap:10px;padding-top:12px}

<script>
(function(){
  // 28-Tage-Zyklus ab Montag: 6×Spät (Mo–Sa), So frei, 6×Früh (Mo–Sa), 6×Nacht (So–Fr), 9 Tage frei
  const PATTERN = [..."SSSSSS","X",..."FFFFFF",..."NNNNNN",..."XXXXXXXXX"];
  const NAMES = {F:"Frühschicht",S:"Spätschicht",N:"Nachtschicht",X:"Frei",U:"Urlaub"};
  const SHORT = {F:"F",S:"S",N:"N",X:"frei"};
  const MONTHS = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
  const WD = ["So","Mo","Di","Mi","Do","Fr","Sa"];
  const WDL = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
  let PV=null; // gerade angezeigter Partner-Plan (nur lesen)
  const PVKEYS=["sp_vac2","sp_models","sp_notes","sp_ot","sp_quota","sp_anchor2","sp_base","sp_routines","sp_bdays"];
  const store = {
    get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
    set(k,v){if(PV&&PVKEYS.includes(k))return;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  };

  const dn = (y,m,d)=>Math.round(Date.UTC(y,m,d)/864e5);
  const fromDn = n=>{const d=new Date(n*864e5);return {y:d.getUTCFullYear(),m:d.getUTCMonth(),d:d.getUTCDate(),w:d.getUTCDay()}};
  const iso = n=>{const o=fromDn(n);return o.y+"-"+String(o.m+1).padStart(2,"0")+"-"+String(o.d).padStart(2,"0")};
  const parseIso = s=>{const [y,m,d]=s.split("-").map(Number);return dn(y,m-1,d)};
  const now = new Date();
  const TODAY = dn(now.getFullYear(),now.getMonth(),now.getDate());

  let anchor = parseIso(store.get("sp_anchor2","2026-12-21")); // Montag, an dem ein Spät-Block beginnt
  // Urlaub: {Tagnummer: "U" | "TZ"}; alte Einträge (nur Liste) werden als U übernommen
  let vac = store.get("sp_vac2",null);
  if(!vac){vac={};store.get("sp_vac",[]).forEach(n=>vac[n]="U")}
  let quota = Object.assign({U:30,TZ:8}, store.get("sp_quota",{}));
  const saveVac = ()=>store.set("sp_vac2",vac);
  const vt = n=>vac[n]||null;
  let notes=store.get("sp_notes",{}); const saveNotes=()=>store.set("sp_notes",notes);
  let ot=store.get("sp_ot",[]); const saveOt=()=>store.set("sp_ot",ot);
  let otCfg=Object.assign({agHours:8,carry:0},store.get("sp_otcfg",{}));
  let contacts=store.get("sp_contacts",[]); const saveContacts=()=>store.set("sp_contacts",contacts);
  let pickStart=null, pickType="U";
  const TYPE = {
    U:{name:"Urlaub",short:"U",col:"var(--urlaub)",ink:"var(--urlaub-ink)",quota:true},
    TZ:{name:"TZ-Urlaub",short:"TZ",col:"var(--tz)",ink:"var(--tz-ink)",quota:true},
    AG:{name:"Ausgleich",short:"AG",col:"var(--ag)",ink:"var(--ag-ink)",quota:false},
    K:{name:"Krank",short:"K",col:"var(--krank)",ink:"var(--krank-ink)",quota:false},
    SU:{name:"Sonderurlaub",short:"SU",col:"var(--su)",ink:"var(--su-ink)",quota:false}};
  const KINDS=["U","TZ","AG","K","SU"];

  let models=store.get("sp_models",[]); const saveModels=()=>{store.set("sp_models",models);mCache=null};
  let mCache=null;
  function modelFor(n){ if(!mCache)mCache=models.map(m=>{const pat=[];m.blocks.forEach(([t,c])=>{for(let i=0;i<c;i++)pat.push(t)});return {m,a:parseIso(m.from),b:parseIso(m.to),pat}});
    for(let i=mCache.length-1;i>=0;i--){const c=mCache[i];if(n>=c.a&&n<=c.b&&c.pat.length)return c}return null}
  let base=store.get("sp_base","175"); // "175" = 17,5-Modell als Grundlage, "none" = leerer Kalender (nur eigene Modelle)
  const rawShift = n=>{const c=modelFor(n);return c?c.pat[(n-c.a)%c.pat.length]:base==="none"?"X":PATTERN[((n-anchor)%28+28)%28]};
  // ---------- Routinen (z. B. Hausordnung jeden 2. Samstag) ----------
  let routines=store.get("sp_routines",[]); const saveRoutines=()=>store.set("sp_routines",routines);
  const RUNIT={d:["Tag","Tage"],w:["Woche","Wochen"],m:["Monat","Monate"]};
  function rOn(r,n){const a=parseIso(r.start);if(n<a||(r.end&&n>parseIso(r.end)))return false;const k=Math.max(1,r.n|0);
    if(r.unit==="d")return (n-a)%k===0; if(r.unit==="w")return (n-a)%(7*k)===0;
    const A=fromDn(a),B=fromDn(n);return B.d===A.d&&((B.y-A.y)*12+B.m-A.m)%k===0}
  const routinesOn=n=>routines.filter(r=>rOn(r,n));
  // ---------- Geburtstage ----------
  let bdays=store.get("sp_bdays",[]); const saveBdays=()=>store.set("sp_bdays",bdays);
  let bdLead=store.get("sp_bdlead",7);
  const leap=y=>(y%4===0&&y%100!==0)||y%400===0;
  function bdIn(b,y){const [m,d]=b.d.split("-").map(Number);return (m===2&&d===29&&!leap(y))?dn(y,1,28):dn(y,m-1,d)} // 29.2. in Nicht-Schaltjahren am 28.2.
  const bdOn=n=>bdays.filter(b=>bdIn(b,fromDn(n).y)===n);
  function bdNext(b,from){const y=fromDn(from).y;let n=bdIn(b,y);if(n<from)n=bdIn(b,y+1);return n}
  const bdAge=(b,n)=>b.y?fromDn(n).y-b.y:null;
  // An allen Feiertagen (inkl. Heiligabend und Silvester) wird nicht gearbeitet
  const shift = n=>{const s=rawShift(n);return s!=="X"&&holiday(n)?"X":s};
  const fmt = n=>{const o=fromDn(n);return WDL[o.w]+", "+o.d+". "+MONTHS[o.m]+" "+o.y};
  const fmtS = n=>fmt(n).replace(/ \d{4}$/,"");
  // Verbrauch: zählt nur Urlaub auf geplanten Schichttagen
  function used(y,t){let c=0;for(const k in vac){const n=+k;if(vac[k]===t&&shift(n)!=="X"&&!holiday(n)&&fromDn(n).y===y)c++  /* Feiertage kosten keinen Urlaubstag */}return c}
  const left = (y,t)=>quota[t]-used(y,t);

  // Gesetzliche Feiertage Bayern
  const holCache={};

  // Welche Figuren passen zum angezeigten Monat?
  function pool(m){
    const y=typeof viewYear==="number"?viewYear:fromDn(TODAY).y, e=easter(y), eo=fromDn(e);
    // Osterhase nur im Oster-Monat und in den 3 Wochen davor
    const bunny=(m===eo.m)||(m===eo.m-1&&eo.d<=21);
    const P={
      0:["birds","snowman","star","snowman"],            // Januar: Winter
      1:["birds","snowman","star"],                      // Februar: Winter
      2:["birds","birds","butterfly"],                   // März: Frühlingsanfang
      3:["ducks","ladybug","butterfly","birds"],         // April
      4:["ducks","ladybug","butterfly","bee"],           // Mai
      5:["bee","butterfly","ducks","ladybug"],           // Juni: Sommer
      6:["bee","butterfly","ladybug","ducks"],           // Juli
      7:["bee","butterfly","ducks"],                     // August
      8:["birds","squirrel","hedgehog"],                 // September: Herbst
      9:["squirrel","hedgehog","birds"],                 // Oktober
      10:["lanterns","squirrel","birds"],                // November: St. Martin, Eichhörnchen
      11:["sleigh","christkind","nikolaus","snowman","star"] // Dezember

  }
  let critters=[], curMonth=fromDn(TODAY).m;

  const FRONT=1.22; // Teilchen davor schweben über den Kalender
  // Gewitter (Herbst): ab und zu ein Blitz mit Aufleuchten, danach Donner
  let bolt=null, nextBolt=900;
  function makeBolt(){const x0=rnd(W*.15,W*.85),yEnd=rnd(H*.45,H*.8),main=[[x0,-10]];let x=x0,y=-10;
    while(y<yEnd){y+=rnd(14,34);x+=rnd(-22,22);main.push([x,y])}
    const br=[];for(let i=0;i<3;i++){const k=2+Math.floor(Math.random()*(main.length-3));let [bx,by]=main[k];const b=[[bx,by]],dir=Math.random()<.5?-1:1;
      for(let j=0;j<4+Math.floor(Math.random()*4);j++){by+=rnd(10,24);bx+=dir*rnd(4,20);b.push([bx,by])}br.push(b)}
    return {t:0,main,br,far:Math.random()}}
  function drawBolt(){ if(!bolt)return; const t=bolt.t, on=t<5||(t>8&&t<12)||(t>15&&t<17);
    // Aufleuchten des Himmels (sanft, nicht blendend)
    const fl=t<3?.32:t<6?.18:t>8&&t<11?.24:t<20?.08*(1-(t-11)/9):0;
    if(fl>0){cx=cxF;cx.save();cx.globalAlpha=fl;cx.fillStyle="#eef3ff";cx.fillRect(0,0,W,H);cx.restore()}
    if(on){cx=cxF;cx.save();cx.strokeStyle="#ffffff";cx.shadowColor="#9ec0ff";cx.shadowBlur=18;cx.lineCap="round";cx.lineJoin="round";
      const path=(pts,w)=>{cx.lineWidth=w;cx.beginPath();pts.forEach(([x,y],i)=>i?cx.lineTo(x,y):cx.moveTo(x,y));cx.stroke()};
      cx.globalAlpha=.95;path(bolt.main,3.2);cx.globalAlpha=.7;bolt.br.forEach(b=>path(b,1.6));cx.restore()}}
  function draw(){
    cx=cxF; cx.clearRect(0,0,W,H);
    for(const p of parts)if(p.z>FRONT)drawP(p);
    for(const p of extras)drawP(p);
    drawCritters();
    cx=cxB; cx.clearRect(0,0,W,H);
    if(season==="summer"){ // Sonne mit langsam drehenden Strahlen
      const sx=W*.86,sy=26,R=Math.max(W,H)*.75;cx.save();cx.globalAlpha=.32;const g=cx.createRadialGradient(sx,sy,0,sx,sy,R*.7);g.addColorStop(0,cols.sun);g.addColorStop(1,"rgba(255,200,80,0)");cx.fillStyle=g;cx.fillRect(0,0,W,H);
      cx.translate(sx,sy);cx.rotate(T*.0012);cx.globalAlpha=.10+.04*Math.sin(T*.01);cx.fillStyle=cols.sun;
      for(let i=0;i<12;i++){cx.rotate(Math.PI/6);cx.beginPath();cx.moveTo(0,0);cx.lineTo(R,-R*.06);cx.lineTo(R,R*.06);cx.closePath();cx.fill()}cx.restore()}

      for(let x=0;x<=W;x+=12)cx.lineTo(x,H-drift*(.7+.3*Math.sin(x*.025+1.3)+.15*Math.sin(x*.07)));cx.lineTo(W,H);cx.closePath();cx.fill()}
    cx.globalAlpha=1;

  }
  let animOn=store.get("sp_anim",true), cleared=false;
  function setAnim(on){animOn=on;store.set("sp_anim",on);cleared=false;if(on&&reduceMotion)draw()}
  function step(p){
    const z=p.z, w=(wind+gust)*z;
    p.ph+=.014; p.flip+=p.vf*(1+Math.abs(gust)*.6); p.rot+=p.vr*(1+Math.abs(gust)*.8);
    if(p.life!=null){p.x+=p.vx;p.y+=p.vy0;p.vx*=.95;p.vy0=p.vy0*.95+(season==="summer"?-.02:.04);p.life--;return}
    p.x+=Math.sin(p.ph)*p.sw*.55+w; p.y+=p.vy-scrollV*.18*z;
    if(season==="summer")p.x+=Math.sin(T*.01+p.tw)*.3;
  }
  function tick(){
    if(!animOn){ if(!cleared){cxB.clearRect(0,0,W,H);cxF.clearRect(0,0,W,H);cleared=true} }
    else if(!document.hidden){
      T++;
      // Wind und Böen
      wind=Math.sin(T*.0035)*.45;
      if(T>nextGust){gustTarget=rnd(1.4,3.2)*(Math.random()<.5?-1:1)*(season==="summer"?.4:1);nextGust=T+rnd(420,900)}
      gust+=(gustTarget-gust)*.02; gustTarget*=.985;
      // Scroll-Schwung
      const sy=window.scrollY; scrollV=scrollV*.85+(sy-lastScroll)*.15; lastScroll=sy;
      for(const p of parts){step(p); if(p.y>H+16||p.y<-16||p.x<-40||p.x>W+40){const z=p.z;spawn(p,false);p.z=z;
        if(p.x<0&&gust+wind>0)p.x=rnd(-30,0); if(p.x>W&&gust+wind<0)p.x=rnd(W,W+30)}}
      // Seiteneinstieg bei starkem Wind
      if(Math.abs(gust)>1){const p=parts[Math.floor(Math.random()*parts.length)];if(p.y>H*.9){p.x=gust>0?-20:W+20;p.y=rnd(0,H*.8)}}
      extras=extras.filter(p=>{step(p);return p.life>0});
      if(season==="winter")drift=Math.min(22,drift+.004);
      // gelegentlicher Besuch: Schmetterling, Vögel, Sternschnuppe
      if(T>nextCritter&&critters.length<2){newCritter();nextCritter=T+rnd(420,900)}
      if(season==="autumn"&&!bolt&&T>nextBolt){bolt=makeBolt();nextBolt=T+rnd(1800,4200);if(typeof sndThunder==="function")sndThunder(bolt.far)}
      if(bolt&&++bolt.t>22)bolt=null;

      if(!critters.some(c=>c.kind==="fireworks")&&T%240===0){const o=fromDn(TODAY);const nye=(o.m===11&&o.d===31)||(o.m===0&&o.d===1);

  function blockOf(n){ // zusammenhängender Urlaub gleicher Art, freie Tage dazwischen werden überbrückt
    const t=vt(n); let a=n,b=n;
    for(let i=b+1;;i++){ if(vt(i)===t){b=i;continue} if(shift(i)==="X"&&!vt(i))continue; break }
    for(let i=a-1;;i--){ if(vt(i)===t){a=i;continue} if(shift(i)==="X"&&!vt(i))continue; break }
    return [a,b];
  }
  function dayMenu(n){
    eventFx(n);
    const s=shift(n), t=vt(n), ft=holiday(n), y=fromDn(n).y;
    let html='<h3>'+fmt(n)+'</h3>'+(ft?'<p><b style="color:var(--feiertag)">'+icon(n)+' Feiertag: '+ft+'</b></p>':special(n)?'<p><b style="color:var(--fg)">'+ICON[special(n)]+' '+special(n)+'</b> (kein gesetzlicher Feiertag)</p>':'')+(dst(n)?'<div class="nbox"><b>🕑 '+dst(n)+' beginnt</b><p>'+DST_TXT[dst(n)]+' '+dstNight(n)+'</p></div>':'')+
      (ft?'<p>An '+ft+' wird nicht gearbeitet.'+(rawShift(n)!=="X"?' Laut Rhythmus wäre '+NAMES[rawShift(n)]+'.':'')+'</p>':'')+
      (modelFor(n)?'<p>Schichtmodell: <b>'+esc(modelFor(n).m.name)+'</b></p>':'')+
      '<p>Plan: <b>'+NAMES[s]+'</b>'+(t?' · eingetragen als <b>'+(t==="K"?"🌡️ ":"")+TYPE[t].name+'</b>':'')+'</p>'+
      routinesOn(n).map(r=>'<p><span class="rtab">'+esc(r.ab)+'</span><b>'+esc(r.name)+'</b> (Routine)</p>').join("")+
      bdOn(n).map(b=>'<p>🎂 <b>'+esc(b.name)+'</b> hat Geburtstag'+(bdAge(b,n)!=null?' und wird <b>'+bdAge(b,n)+'</b>':'')+'</p>').join("");
    if(!noteAt(n)) html+='<button class="btn notebtn" data-a="note">📝 Nur Notiz hinzufügen</button>';
    html+='<button class="btn notebtn" data-a="bday">🎂 Geburtstag an diesem Tag eintragen</button>';
    if(!t){
      if(ft&&s!=="X") html+='<p>An diesem Feiertag wird <b>nichts abgezogen und nichts gezählt</b>.</p>';
      html+='<h4>Was möchtest du eintragen?</h4><div class="row2">'+KINDS.map(k=>tyBtn(k,'data-a="type"',TYPE[k].name,sub(k,y))).join("")+'</div>';
    } else {
      html+='<h4>Ändern in</h4><div class="row2">'+KINDS.filter(k=>k!==t).map(k=>tyBtn(k,'data-a="swap"',TYPE[k].name,"")).join("")+'</div>';
      html+='<button class="btn danger" data-a="del1">'+TYPE[t].name+' an diesem Tag entfernen</button>';
      const [a,b]=blockOf(n);
      if(b>a){let w=0;for(let i=a;i<=b;i++)if(vt(i)===t&&shift(i)!=="X")w++;
        html+='<button class="btn danger" data-a="delblk">Ganzen Zeitraum entfernen <small>'+dShort(a)+' – '+dShort(b)+' · '+w+' Tage</small></button>';}
    }
    const ol=otOn(n);
    html+='<h4>Überstunden</h4>'+ol.map(o=>'<button class="btn" data-a="otedit" data-id="'+o.id+'">⏱ '+o.from+'–'+o.to+' <small>'+hm(o.min)+(o.note?' · '+esc(o.note):'')+'</small></button>').join("")+
      '<button class="btn ty" style="--tc:var(--ue);--ti:var(--ue-ink)" data-a="otnew">⏱ Überstunden eintragen</button>';
    const na=noteAt(n);
    html+= na ? '<div class="nbox"><b>📝 Notiz'+(na[1].to?' ('+dShort(na[0])+' – '+dShort(na[1].to)+')':'')+'</b><p>'+esc(na[1].t)+'</p></div><button class="btn" data-a="note">Notiz bearbeiten</button>'
              : '';
    html+='<button class="btn" data-a="close">Schließen</button>';
    openSheet(html);
    sheet.onclick=ev=>{
      const btn=ev.target.closest("[data-a]"); if(!btn)return;
      const a=btn.dataset.a, ty=btn.dataset.t;
      if(a==="note") return noteSheet(n);
      if(a==="bday") return bdEditor(-1,n);
      if(a==="otnew") return otSheet(n);

      closeSheet();

  const dShort = n=>{const o=fromDn(n);return WD[o.w]+" "+o.d+"."+(o.m+1)+".";};

  // Schritt 3: kleiner Kalender zum Auswählen von–bis
  function openPicker(start,ty,opt){
    opt=opt||{}; const st={a:opt.a!=null?opt.a:start,b:opt.b!=null?opt.b:null,y:fromDn(start).y,m:fromDn(start).m};
    function count(){ if(st.b==null)return null; let d=0,w=0,add=0,clash=[],hol=0;
      for(let i=st.a;i<=st.b;i++){d++; if(shift(i)!=="X"){w++; const o=vt(i); if(o&&o!==ty)clash.push(o); if(holiday(i)){hol++;continue} if(o!==ty||(opt.replace&&i>=opt.replace[0]&&i<=opt.replace[1]))add++}} return {d,w,add,clash,hol}; }
    function render(){
      const first=dn(st.y,st.m,1), days=new Date(Date.UTC(st.y,st.m+1,0)).getUTCDate(), lead=(fromDn(first).w+6)%7;
      let cells="";
      for(let i=0;i<lead;i++)cells+='<span></span>';
      for(let d=0;d<days;d++){const n=first+d,s=shift(n),end=st.b==null?st.a:st.b,inr=n>=st.a&&n<=end;
        const cls="pkd "+s+(inr?" in":"")+(n===st.a||n===st.b?" edge":"")+(holiday(n)?" hf":"")+(vt(n)?" has":"");
        cells+='<button type="button" class="'+cls+'" data-pd="'+n+'"><b>'+(d+1)+'</b><i>'+(vt(n)||(s==="X"?"":s))+'</i></button>';}
      const c=count(), y=fromDn(st.a).y, T=TYPE[ty];
      let info;
      if(st.b==null) info='Von <b>'+dShort(st.a)+'</b>: jetzt den <b>letzten Tag</b> antippen';
      else {
        info='Von <b>'+dShort(st.a)+'</b> bis <b>'+dShort(st.b)+'</b><br>'+c.d+' Kalendertage, davon <b>'+c.w+' Schichttage</b>'+
          (c.hol?' ('+c.hol+(c.hol===1?' Feiertag zählt':' Feiertage zählen')+' nicht)':'')+'<br>→ ';
        info+= T.quota ? c.add+' '+ty+' werden abgezogen, danach '+(left(y,ty)-c.add+(opt.replace?(()=>{let r=0;for(let i=opt.replace[0];i<=opt.replace[1];i++)if(vt(i)===ty&&shift(i)!=="X"&&!holiday(i))r++;return r})():0))+' von '+quota[ty]+' übrig'
                       : c.add+' '+T.name+'-Tage werden gezählt, dann '+(used(y,ty)+c.add)+' in '+y;
        if(c.clash.length){const k=[...new Set(c.clash)].map(x=>TYPE[x].name).join(", ");
          info+='<br>'+c.clash.length+' Tag(e) mit '+k+' werden ersetzt'+(c.clash.some(x=>TYPE[x].quota)?' (der Urlaub wird dir gutgeschrieben)':'')+'.';}
      }
      sheet.innerHTML='<div class="grab"></div><h3>'+T.name+': Zeitraum</h3>'+
        '<div class="pkbar"><button type="button" class="iconbtn sq" data-nav="-1" aria-label="Vorheriger Monat">‹</button><strong>'+MONTHS[st.m]+' '+st.y+'</strong><button type="button" class="iconbtn sq" data-nav="1" aria-label="Nächster Monat">›</button></div>'+
        '<div class="pk" style="--sel:'+T.col+';--selink:'+T.ink+'"><span class="h">Mo</span><span class="h">Di</span><span class="h">Mi</span><span class="h">Do</span><span class="h">Fr</span><span class="h">Sa</span><span class="h">So</span>'+cells+'</div>'+
        '<p class="pkinfo">'+info+'</p>'+
        '<button class="btn ty half" '+tyStyle(ty)+' data-a="ok"'+(st.b==null?' disabled':'')+'>'+T.name+' eintragen</button>'+
        '<button class="btn half" data-a="close">Abbrechen</button>';
    }
    sheet.hidden=false; scrim.hidden=false; render();
    sheet.onclick=ev=>{
      const nav=ev.target.closest("[data-nav]"), pd=ev.target.closest("[data-pd]"), a=ev.target.closest("[data-a]")?.dataset.a;
      if(nav){const o=norm({y:st.y,m:st.m+ +nav.dataset.nav});st.y=o.y;st.m=o.m;render();return}
      if(pd){const n=+pd.dataset.pd;
        if(st.b!=null){st.a=n;st.b=null} else if(n<st.a){st.b=st.a;st.a=n} else st.b=n;
        render();return}
      if(a==="ok"&&st.b!=null){ if(opt.replace){for(let i=opt.replace[0];i<=opt.replace[1];i++)if(vt(i)===ty)delete vac[i]} for(let i=st.a;i<=st.b;i++) if(shift(i)!=="X") vac[i]=ty; saveVac();repaintAll(); if(opt.replace){closeSheet();refreshOverlays();toast("Zeitraum geändert");return} let f=st.a; while(shift(f)==="X"&&f<st.b)f++; let l=st.b; while(shift(l)==="X"&&l>f)l--; noteSheet(f,{prompt:true,to:l>f?l:null})}
      if(a==="close")closeSheet();
    };
  }

  // ---------- Jahresübersicht (A4) ----------
  const yv=document.getElementById("yearView");

      const first=dn(y,m,1), days=new Date(Date.UTC(y,m+1,0)).getUTCDate(), lead=(fromDn(first).w+6)%7;
      let c='<span class="h">M</span><span class="h">D</span><span class="h">M</span><span class="h">D</span><span class="h">F</span><span class="h">S</span><span class="h">S</span>';
      for(let i=0;i<lead;i++)c+='<span></span>';

    const hl=[...holidays(y)].map(([n,name])=>'<li><span class="ic">'+ICON[name]+'</span><b>'+fromDn(n).d+'.'+(fromDn(n).m+1)+'.</b> '+name+'</li>').join("");
    yv.innerHTML='<div class="yvbar"><button type="button" class="iconbtn sq" data-y="-1" aria-label="Vorheriges Jahr">‹</button><strong>'+y+'</strong><button type="button" class="iconbtn sq" data-y="1" aria-label="Nächstes Jahr">›</button><button type="button" class="iconbtn" data-y="x">Schließen</button></div>'+
      '<div class="yvact"><button type="button" class="btn primary" data-y="pdf">📄 Als PDF speichern und drucken</button></div>'+

      '<div class="a4wrap"><div class="a4"><div class="a4head"><span>Schichtplan '+y+(PV?' · '+esc(PV.n):'')+'</span><small>'+(base==="none"?'Bayern':'17,5-Modell · Bayern')+'</small></div>'+
      '<div class="ygrid">'+months+'</div>'+
      '<div class="a4foot"><div class="lg"><span class="yd F">F</span>Früh <span class="yd S">S</span>Spät <span class="yd N">N</span>Nacht <span class="yd X">&nbsp;</span>Frei <span class="yd X hf">&nbsp;</span>Feiertag (frei) <span class="weleg"></span>Wochenende</div>'+
      '<div class="sum">Früh '+cnt.F+' · Spät '+cnt.S+' · Nacht '+cnt.N+' · Schichten gesamt '+(cnt.F+cnt.S+cnt.N)+' · Feiertage auf Schichttagen '+ftInShift(y)+'</div>'+
      '<ul class="yhol">'+hl+'</ul></div></div></div>';
    fitA4();
    yv.onclick=ev=>{const b=ev.target.closest("[data-y]");if(!b)return;if(b.dataset.y==="x"){yv.hidden=true;document.body.style.overflow="";return}if(b.dataset.y==="pdf"){savePdf(y);return}renderYear(y+ +b.dataset.y)};
  }
  function fitA4(){const w=yv.querySelector(".a4wrap");if(!w)return;const k=Math.min(1,w.clientWidth/794);w.style.height=(1123*k)+"px";w.firstChild.style.transform="scale("+k+")"}
  addEventListener("resize",()=>{if(!yv.hidden)fitA4()});
  function openYear(y){yv.hidden=false;renderYear(y);yv.scrollTop=0;document.body.style.overflow="hidden"}

  // ---------- Farben ----------
  const COLKEYS=[["frueh","Frühschicht"],["spaet","Spätschicht"],["nacht","Nachtschicht"],["urlaub","Urlaub (U)"],["tz","TZ-Urlaub"],["ag","Ausgleich (AG)"],["krank","Krank (K)"],["su","Sonderurlaub (SU)"],["ue","Überstunden (ÜS)"],["feiertag","Feiertag"],["we","Wochenende (Band)"]];
  let colors=store.get("sp_colors",{});
  function inkFor(hex){const h=hex.replace("#","");const r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);
    return (0.299*r+0.587*g+0.114*b)/255>0.6?"#1d1f24":"#ffffff"}
  function applyColors(){const st=document.documentElement.style;
    COLKEYS.forEach(([k])=>{st.removeProperty("--"+k);st.removeProperty("--"+k+"-ink")});
    for(const k in colors){st.setProperty("--"+k,colors[k]);st.setProperty("--"+k+"-ink",inkFor(colors[k]))}}
  applyColors();
  const curCol = k=>{const v=getComputedStyle(document.documentElement).getPropertyValue("--"+k).trim();return /^#[0-9a-f]{6}$/i.test(v)?v:"#888888"};

  // ---------- Speichern / Laden ----------
  let dl=null;
  try{ window.claude?.use?.("downloads").then(d=>{dl=d}).catch(()=>{}) }catch(e){}
  const todayIso=()=>iso(TODAY);
  function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,3200)}
  async function saveFile(filename,data,fallbackText){
    if(dl){ try{ await dl.save({filename,data}); toast("Gespeichert: "+filename); return }
      catch(e){ if(e&&e.code==="declined") return; } }
    // Fallback: Text zum Kopieren anzeigen
    if(fallbackText==null){toast("Speichern ist in dieser Ansicht nicht möglich. Öffne den Schichtplan in der Claude-App oder auf claude.ai.");return}
    openSheet('<h3>Zum Kopieren</h3><p>Direktes Speichern geht in dieser Ansicht nicht. Kopiere den Text und sichere ihn z. B. in einer Notiz oder schick ihn dir per WhatsApp.</p>'+
      '<textarea id="cpTxt" readonly rows="6">'+fallbackText.replace(/</g,"&lt;")+'</textarea>'+
      '<button class="btn primary" data-a="copy">Text kopieren</button><button class="btn" data-a="close">Schließen</button>');
    sheet.onclick=ev=>{const a=ev.target.closest("[data-a]")?.dataset.a;if(!a)return;
      if(a==="close")return closeSheet();
      const ta=document.getElementById("cpTxt");
      navigator.clipboard?.writeText(ta.value).then(()=>toast("Kopiert"),()=>{ta.select();toast("Text markiert, jetzt kopieren")}) ?? (ta.select(),toast("Text markiert, jetzt kopieren"));};
  }
  function backupData(){return {app:"schichtplan-17-5",version:1,saved:todayIso(),anchor:iso(anchor),quota,vac,colors,anim:animOn,notes,contacts,ot,otCfg,models,partners:store.get("sp_partners",[]),routines,base,bdays,bdLead}}
  function saveBackup(){const j=JSON.stringify(backupData()); saveFile("Schichtplan-Sicherung-"+todayIso()+".json",j,j)}
  function parseBackup(txt){
    let d; try{d=JSON.parse(txt)}catch(e){return null}
    if(!d||d.app!=="schichtplan-17-5"||typeof d.vac!=="object")return null;
    for(const k in d.vac){if(!TYPE[d.vac[k]]||!/^\d+$/.test(k))return null}
    return d;
  }
  function restoreSheet(){
    openSheet('<h3>Sicherung laden</h3><p>Wähle die gespeicherte Datei (.json) oder füge den kopierten Sicherungstext ein.</p>'+
      '<label class="btn" for="bkFile">Datei auswählen <small>.json</small><input type="file" id="bkFile" accept=".json,application/json,text/plain" hidden></label>'+
      '<textarea id="bkTxt" rows="4" placeholder="Oder Sicherungstext hier einfügen"></textarea>'+
      '<div class="err" id="bkErr"></div><div id="bkConfirm"></div>'+
      '<button class="btn" data-a="check">Text prüfen</button><button class="btn" data-a="close">Abbrechen</button>');
    const show=txt=>{const d=parseBackup(txt), box=document.getElementById("bkConfirm"), er=document.getElementById("bkErr");
      if(!d){er.textContent="Das ist keine gültige Schichtplan-Sicherung. Bitte die .json-Datei aus „Sicherung speichern“ verwenden.";box.innerHTML="";return}
      er.textContent=""; const cnt={}; for(const k in d.vac)cnt[d.vac[k]]=(cnt[d.vac[k]]||0)+1;
      box.innerHTML='<p>Sicherung vom <b>'+(d.saved||"?")+'</b>: '+(Object.keys(cnt).map(k=>cnt[k]+' '+k).join(", ")||"keine Einträge")+(d.notes?', '+Object.keys(d.notes).length+' Notizen':'')+(d.contacts?', '+d.contacts.length+' Telefonnummern':'')+(d.ot?', '+d.ot.length+' Überstunden-Einträge':'')+'.<br>Deine jetzigen Einträge werden dabei ersetzt.</p>'+
        '<button class="btn primary" data-a="apply">Sicherung jetzt laden</button>';
      box.dataset.json=JSON.stringify(d);};
    document.getElementById("bkFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>show(String(r.result));r.readAsText(f)};
    sheet.onclick=ev=>{const a=ev.target.closest("[data-a]")?.dataset.a;if(!a)return;
      if(a==="close")return closeSheet();
      if(a==="check")return show(document.getElementById("bkTxt").value.trim());
      if(a==="apply"){const d=JSON.parse(document.getElementById("bkConfirm").dataset.json);
        vac=d.vac; saveVac();
        if(d.quota){quota=Object.assign({U:30,TZ:8},d.quota);store.set("sp_quota",quota)}
        if(d.anchor&&fromDn(parseIso(d.anchor)).w===1){anchor=parseIso(d.anchor);store.set("sp_anchor2",d.anchor)}
        if(d.colors){colors=d.colors;store.set("sp_colors",colors);applyColors()}
        if(typeof d.anim==="boolean")setAnim(d.anim);
        if(d.notes&&typeof d.notes==="object"){notes=d.notes;saveNotes()}
        if(Array.isArray(d.ot)){ot=d.ot.filter(o=>o&&o.id&&o.from&&o.to);saveOt()}
        if(Array.isArray(d.models)){models=d.models;saveModels()}
        if(d.otCfg){otCfg=Object.assign({agHours:8,carry:0},d.otCfg);store.set("sp_otcfg",otCfg)}
        if(Array.isArray(d.contacts)){contacts=d.contacts.filter(c=>c&&c.name&&c.tel);saveContacts()}
        if(Array.isArray(d.bdays)){bdays=d.bdays.filter(x=>x&&x.name&&/^\d\d-\d\d$/.test(x.d));saveBdays()}
        if(d.bdLead>=0){bdLead=+d.bdLead;store.set("sp_bdlead",bdLead)}
        if(Array.isArray(d.routines)){routines=d.routines.filter(x=>x&&x.name&&x.start);saveRoutines()}
        if(d.base==="none"||d.base==="175"){base=d.base;store.set("sp_base",base)}
        if(Array.isArray(d.partners)){try{partners=d.partners.filter(p=>p&&p.n&&p.a);savePartners()}catch(e){}}
        repaintAll(); closeSheet(); toast("Sicherung geladen");}
    };

  // Einträge eines Jahres als zusammenhängende Zeiträume
  function entries(y){
    const out=[], a0=dn(y,0,1), a1=dn(y+1,0,1); let cur=null;
    for(let n=a0;n<a1;n++){const t=vt(n);
      if(t){ if(cur&&cur.t===t&&cur.last+1===n){cur.last=n;cur.days.push(n)} else {cur={t,first:n,last:n,days:[n]};out.push(cur)} }
      else if(cur&&shift(n)==="X"&&!vt(n)){ /* freie Tage überbrücken */ const nx=(()=>{for(let i=n+1;i<a1;i++){if(vt(i))return vt(i)===cur.t?i:-1;if(shift(i)!=="X")return -1}return -1})(); if(nx>0){cur.last=n;continue} cur=null }
      else cur=null;
    }
    out.forEach(e=>{e.count=e.days.filter(n=>shift(n)!=="X"&&!holiday(n)).length; e.hol=e.days.filter(n=>holiday(n)&&shift(n)!=="X").length});
    return out;
  }
  function csvFor(y){
    const rows=[["Datum","Wochentag","Eintrag","Geplante Schicht","Feiertag","Wird gezählt","Notiz","Von","Bis","Stunden"]];
    for(let n=dn(y,0,1);n<dn(y+1,0,1);n++){const t=vt(n);if(!t)continue;const o=fromDn(n),s=shift(n),h=holiday(n);
      rows.push([String(o.d).padStart(2,"0")+"."+String(o.m+1).padStart(2,"0")+"."+o.y,WDL[o.w],TYPE[t].name,NAMES[s],h||"",(s!=="X"&&!h)?"ja":"nein",(noteAt(n)||[0,{t:""}])[1].t])}
    ot.filter(o=>fromDn(o.d).y===y).forEach(o=>{const d=fromDn(o.d);rows.push([String(d.d).padStart(2,"0")+"."+String(d.m+1).padStart(2,"0")+"."+d.y,WDL[d.w],"Überstunden",NAMES[shift(o.d)],holiday(o.d)||"","",o.note||"",o.from,o.to,String(Math.round(o.min/60*100)/100).replace(".",",")])});
    return "﻿"+rows.map(r=>r.map(c=>/[;"\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c).join(";")).join("\r\n");
  }

  async function savePdf(y){

    const doc=new lib.jsPDF({unit:"mm",format:"a4"});
    const C={F:curCol("frueh"),S:curCol("spaet"),N:curCol("nacht"),U:curCol("urlaub"),TZ:curCol("tz"),AG:curCol("ag"),K:curCol("krank"),SU:curCol("su"),X:"#4a4d53",FT:curCol("feiertag"),WE:curCol("we")};

      const first=dn(y,m,1),days=new Date(Date.UTC(y,m+1,0)).getUTCDate(),lead=(fromDn(first).w+6)%7,rows=Math.ceil((lead+days)/7);
      // Wochenend-Band hinter Samstag und Sonntag
      doc.setGState(new doc.GState({opacity:.42}));fill(C.WE);doc.roundedRect(x0+5*cw-.3,y0+1.2,2*cw+.6,4+rows*ch+.4,1.6,1.6,"F");doc.setGState(new doc.GState({opacity:1}));
      for(let d=0;d<days;d++){const n=first+d,p=lead+d,cx=x0+(p%7)*cw,cy=y0+5+Math.floor(p/7)*ch,s=shift(n),t=null,h=holiday(n),key=s;
        fill(h?C.FT:C[key]);doc.roundedRect(cx+.3,cy+.3,cw-.6,ch-.6,.8,.8,"F");

        const ink=h?"#ffffff":(key==="X"?"#ffffff":inkFor(C[key]));txt(ink);
        doc.setFont("helvetica","normal");doc.setFontSize(5.2);doc.text(String(d+1),cx+cw/2,cy+2.5,{align:"center"});
        if(h){const im=emojiPng(ICON[h]);if(im)doc.addImage(im,"PNG",cx+cw/2-1.5,cy+2.9,3,3)}
        const lab=t?t:(h?"":(s==="X"?"Frei":s)); if(lab){doc.setFont("helvetica","bold");doc.setFontSize(lab==="Frei"?5.4:6.4);doc.text(lab,cx+cw/2,cy+5.2,{align:"center"})}
      }
    }
    // Fuß: Legende, Summen, Feiertage
    let fy=230; stroke("#d8d6d0");doc.setLineWidth(.3);doc.line(12,fy-4,198,fy-4);
    let lx=12; [["F","Früh"],["S","Spät"],["N","Nacht"],["X","Frei"],["FT","Feiertag (frei)"],["WE","Wochenende"]].forEach(([k,l])=>{
      if(k==="WE")doc.setGState(new doc.GState({opacity:.42}));fill(C[k]);doc.roundedRect(lx,fy-3,5,4,.6,.6,"F");doc.setGState(new doc.GState({opacity:1}));doc.setFont("helvetica","normal");doc.setFontSize(7.5);txt("#1d1f24");doc.text(l,lx+6.2,fy);lx+=6.2+doc.getTextWidth(l)+4});
    let cnt={F:0,S:0,N:0};for(let n=dn(y,0,1);n<dn(y+1,0,1);n++){const s=shift(n);if(s!=="X")cnt[s]++}
    fy+=7;doc.setFont("helvetica","bold");doc.setFontSize(8);
    doc.text("Früh "+cnt.F+" · Spät "+cnt.S+" · Nacht "+cnt.N+" · Schichten gesamt "+(cnt.F+cnt.S+cnt.N)+" · Feiertage auf Schichttagen "+ftInShift(y),12,fy);
    fy+=6;doc.setFontSize(7.2);const hl=[...holidays(y)];
    hl.forEach(([n,name],i)=>{const col=Math.floor(i/5),row=i%5,yy=fy+row*4;let x=12+col*62;const o=fromDn(n);
      {const im=emojiPng(ICON[name]);if(im)doc.addImage(im,"PNG",x,yy-2.8,3.4,3.4)}x+=4.5;doc.setFont("helvetica","bold");txt(C.FT);doc.text(o.d+"."+(o.m+1)+".",x,yy);
      doc.setFont("helvetica","normal");txt("#1d1f24");doc.text(name,x+9,yy)});
    try{ await dl.save({filename:"Schichtplan-"+y+(PV?"-"+PV.n.replace(/[^\wäöüÄÖÜß-]+/g,"_"):"")+".pdf",data:doc.output("arraybuffer")}); toast("PDF gespeichert") }
    catch(e){ if(!e||e.code!=="declined") toast("Speichern hat nicht geklappt. Bitte später noch einmal versuchen.") }
  }

  // ---------- Sound je Jahreszeit (alles live erzeugt, keine Dateien) ----------
  function makeSoundEngine(ctx){
    const E={ctx}, R=Math.random, sr=ctx.sampleRate;
    const rr=(a,b)=>a+R()*(b-a), pk=a=>a[Math.floor(R()*a.length)];
    // Ausgang: sanfter Tiefpass + Kompressor, damit nichts schrill oder zu laut wird
    const master=ctx.createGain(); master.gain.value=0;
    const tone=ctx.createBiquadFilter(); tone.type="lowpass"; tone.frequency.value=7500; tone.Q.value=.5;
    const comp=ctx.createDynamicsCompressor(); comp.threshold.value=-20; comp.knee.value=12; comp.ratio.value=4; comp.attack.value=.005; comp.release.value=.25;
    const trim=ctx.createGain(); trim.gain.value=1; master.connect(trim); trim.connect(tone); tone.connect(comp); comp.connect(ctx.destination); E.master=master; E.trim=trim;
    // Hall (Wald/Wiese-Gefühl)
    const len=Math.floor(sr*2.6), ir=ctx.createBuffer(2,len,sr);
    for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(R()*2-1)*Math.pow(1-i/len,3.2)*(i<sr*.012?i/(sr*.012):1)}
    const conv=ctx.createConvolver(); conv.buffer=ir; const wet=ctx.createGain(); wet.gain.value=.55; conv.connect(wet); wet.connect(master);
    function out(pan,rev){const g=ctx.createGain(); let n=g;
      if(ctx.createStereoPanner){const p=ctx.createStereoPanner();p.pan.value=pan||0;g.connect(p);n=p}
      n.connect(master); if(rev){const s=ctx.createGain();s.gain.value=rev;n.connect(s);s.connect(conv)} return g}
    // Rauschen: weiß, rosa, braun
    function nbuf(kind){const b=ctx.createBuffer(1,sr*4,sr),d=b.getChannelData(0);let b0=0,b1=0,b2=0,br=0;
      for(let i=0;i<d.length;i++){const w=R()*2-1;
        if(kind==="pink"){b0=.99765*b0+w*.099046;b1=.963*b1+w*.2965164;b2=.57*b2+w*1.0526913;d[i]=(b0+b1+b2+w*.1848)*.18}
        else if(kind==="brown"){br=(br+.02*w)/1.02;d[i]=br*3.2} else d[i]=w*.5}
      return b}
    const NB={white:nbuf("white"),pink:nbuf("pink"),brown:nbuf("brown")}; E.NB=NB;
    function loop(kind){const s=ctx.createBufferSource();s.buffer=NB[kind];s.loop=true;s.start(0,R()*3);return s}
    function bed(kind,filters,pan,rev){const g=ctx.createGain();g.gain.value=0;let n=loop(kind);
      for(const [type,f,q] of filters){const bq=ctx.createBiquadFilter();bq.type=type;bq.frequency.value=f;bq.Q.value=q||.7;n.connect(bq);n=bq}
      n.connect(g);g.connect(out(pan,rev));return {g,f:n}}
    // Grundgeräusche
    const wind=bed("brown",[["lowpass",420,.6]],0,.15);
    const whistle=bed("pink",[["bandpass",820,9]],-.3,.4);
    const leaves=bed("pink",[["bandpass",3200,.6],["lowpass",6000]],.25,.2);
    const rain=bed("pink",[["highpass",1800],["lowpass",7000]],0,.2);
    const fire=bed("brown",[["lowpass",160]],-.2,0);
    // Bach: mehrere schmale Bänder, die sich ständig leicht verschieben (Plätschern)
    const brook={g:ctx.createGain(),bands:[]}; brook.g.gain.value=0; brook.g.connect(out(.35,.3));
    [[380,3],[720,4],[1150,5],[1900,6],[2900,7]].forEach(([f,q])=>{const bq=ctx.createBiquadFilter();bq.type="bandpass";bq.frequency.value=f;bq.Q.value=q;
      const gg=ctx.createGain();gg.gain.value=.5;loop("pink").connect(bq);bq.connect(gg);gg.connect(brook.g);brook.bands.push({bq,gg,f})});
    E.beds={wind,whistle,leaves,rain,fire,brook};

    // --- Einzelne Geräusche ---
    function env(g,t,a,peak,d){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.setTargetAtTime(0,t+a,d/4)}
    function tone1(t,f0,f1,dur,vol,pan,rev,type){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type||"sine";
      o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);env(g,t,Math.min(.02,dur*.25),vol,dur);
      o.connect(g);g.connect(out(pan,rev));o.start(t);o.stop(t+dur*2+.3)}
    // Bach ohne Rauschen: viele kleine, tonale Bläschen
    E.bubble=(t,pan,big)=>{const f=big?rr(200,340):rr(260,820),o=ctx.createOscillator(),g=ctx.createGain(),d=big?rr(.06,.1):rr(.018,.045);
      o.type="sine";o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*rr(1.35,1.9),t+d);
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(big?rr(.06,.09):rr(.02,.045),t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+d*1.6);
      o.connect(g);g.connect(out(pan,.3));o.start(t);o.stop(t+d*2+.05)};
    E.brookTick=(t,dens)=>{const n=Math.round(dens*(3+R()*5));for(let i=0;i<n;i++)E.bubble(t+R()*.25,rr(.15,.75));if(R()<.04*dens)E.bubble(t+R()*.25,rr(.2,.6),true)};
    // Wassertropfen / Blubbern
    E.droplet=(t,pan)=>{const f=rr(450,900);tone1(t,f,f*rr(1.8,2.8),rr(.03,.06),rr(.025,.05),pan,.6)};

  // Feiertage und Events: Klang nur am echten Tag oder wenn du den Tag antippst
  function eventKey(n){const o=fromDn(n),h=holiday(n),sp=special(n);
    if(o.m===11&&o.d===31)return "silvester"; if(o.m===0&&o.d===1)return "neujahr";
    if(o.m===11&&o.d===6)return "nikolaus"; if(o.m===11&&o.d>=20)return "xmas";
    if(["Faschingsbeginn","Weiberfastnacht","Rosenmontag","Faschingsdienstag"].includes(sp))return "fasching";
    if(sp==="Ostersonntag"||h==="Ostermontag")return "ostern";
    if(sp==="Muttertag")return "muttertag";
    if(h==="Tag der Arbeit")return "maibaum"; if(h==="Tag der Deutschen Einheit")return "einheit";
    if(h==="Heilige Drei Könige")return "sternsinger"; if(h==="Allerheiligen")return "stille";
    if(h==="Christi Himmelfahrt"||h==="Pfingstmontag"||h==="Fronleichnam"||h==="Mariä Himmelfahrt")return "glocken";
    if(dst(n))return "uhr";
    return null}

    if(k==="xmas"){ if(o.d>=24&&o.d<=26){E.churchBells(t,3);const r=E.playSong(t+3.4,XM.i++);toast("🔔 ♪ "+r.name);XM.next=E.ctx.currentTime+3.4+r.len+rnd(60,120)}

    if(k==="nikolaus")E.melody(t,"C4:1 C4:1 G4:1 G4:1 A4:1 A4:1 G4:2 F4:1 F4:1 E4:1 E4:1 D4:1 D4:1 C4:3",.4,12);

  // Sound war an: beim ersten Antippen wieder starten (Browser erlauben Ton erst nach einer Berührung)
  if(SND.on){const EVS=["pointerup","touchend","click","keydown"];

    const done=()=>EVS.forEach(e=>removeEventListener(e,kick,true));
    EVS.forEach(e=>addEventListener(e,kick,{capture:true,passive:true}));

  // models=[{id,name,from:"YYYY-MM-DD",to:"YYYY-MM-DD",blocks:[["S",6],["X",1],...]}]; das zuletzt angelegte gewinnt bei Überschneidung
  const MCOL={F:"var(--frueh)",S:"var(--spaet)",N:"var(--nacht)",X:"var(--frei)"}, MINK={F:"var(--frueh-ink)",S:"var(--spaet-ink)",N:"var(--nacht-ink)",X:"var(--fg)"};
  const MNAME={F:"Früh",S:"Spät",N:"Nacht",X:"Frei"};
  function modelsSheet(){
    const list=models.map((m,i)=>{const len=m.blocks.reduce((s,b)=>s+b[1],0);
      return '<button class="btn" data-mi="'+i+'"><span><b>'+esc(m.name)+'</b><br><small>'+m.from.split("-").reverse().join(".")+' – '+m.to.split("-").reverse().join(".")+' · Zyklus '+len+' Tage</small></span><span class="mchips">'+m.blocks.map(b=>'<i style="background:'+MCOL[b[0]]+';flex:'+b[1]+'"></i>').join("")+'</span></button>'}).join("");
    openSheet('<h3>Schichtplan</h3><p>'+(base==="none"?'Das 17,5-Modell ist ausgeschaltet. Überall, wo kein eigenes Modell gilt, ist der Kalender <b>frei</b>. Lege hier dein eigenes Modell an.':'Überall, wo kein eigenes Modell gilt, rechnet die App mit dem <b>17,5-Modell</b>. Für einen Zeitraum kannst du ein anderes Modell festlegen.')+'</p>'+
      '<h4>Eigene Schichtmodelle</h4>'+(list||'<p class="smeta">Noch kein eigenes Schichtmodell.</p>')+
      '<button class="btn primary" data-a="mnew">+ Neues Schichtmodell</button>'+
      '<h4>17,5-Modell</h4>'+(base==="none"?'<div class="basebox"><p style="margin:0"><b>Das 17,5-Modell ist ausgeschaltet.</b> Dein Kalender ist leer, bis du oben ein eigenes Schichtmodell anlegst.</p><button class="btn primary" data-a="baseon">17,5-Modell wieder einschalten</button></div>':
      '<div class="basebox"><p class="pvnote">Du arbeitest nicht im 17,5-Modell? Dann entferne es hier und du bekommst einen leeren Kalender. Deine Einträge (Urlaub, Notizen, Überstunden) bleiben erhalten. Du kannst es jederzeit wieder einschalten. Bei anderen ändert sich dadurch nichts.</p><button class="btn danger" data-a="baseoff">17,5-Modell entfernen (leerer Kalender)</button></div>')+
      '<button class="btn" data-a="close">Schließen</button>');
    sheet.onclick=ev=>{const mi=ev.target.closest("[data-mi]"),a=ev.target.closest("[data-a]")?.dataset.a;
      if(mi)return modelEditor(+mi.dataset.mi); if(a==="mnew")return modelEditor(-1); if(a==="close")closeSheet();
      if(a==="baseoff"){const b=ev.target.closest("[data-a]");if(b.dataset.sure!=="1"){b.dataset.sure="1";b.textContent="Wirklich entfernen? Nochmal tippen";return}

  function modelEditor(idx){
    const o=fromDn(TODAY);
    const st=idx>=0?JSON.parse(JSON.stringify(models[idx])):{id:Date.now().toString(36),name:"Mein Schichtmodell "+(models.length+1),from:iso(TODAY),to:o.y+"-12-31",blocks:[["S",6],["X",1],["F",6],["X",2]]};
    let sure=false;
    const read=()=>{const g=id=>document.getElementById(id);if(!g("mName"))return;st.name=g("mName").value.trim()||"Schichtmodell";st.from=g("mFrom").value||st.from;st.to=g("mTo").value||st.to};
    function render(){
      const pat=[];st.blocks.forEach(([t,c])=>{for(let i=0;i<c;i++)pat.push(t)});const len=pat.length;
      const f=st.from?parseIso(st.from):TODAY, lead=(fromDn(f).w+6)%7;
      let prev='<span class="h">Mo</span><span class="h">Di</span><span class="h">Mi</span><span class="h">Do</span><span class="h">Fr</span><span class="h">Sa</span><span class="h">So</span>';
      for(let i=0;i<lead;i++)prev+='<span></span>';
      for(let i=0;i<35-lead;i++){const t=len?pat[i%len]:"X",d=fromDn(f+i);prev+='<span class="mp" style="background:'+MCOL[t]+';color:'+MINK[t]+'"><b>'+d.d+'.</b>'+(t==="X"?"":t)+'</span>'}
      sheet.innerHTML='<div class="grab"></div><h3>'+(idx>=0?'Schichtmodell ändern':'Neues Schichtmodell')+'</h3>'+
        '<label class="f" for="mName">Name<input type="text" id="mName" class="inp" maxlength="40" value="'+esc(st.name)+'"></label>'+
        '<div class="row2"><label class="f" for="mFrom">Gilt von<input type="date" id="mFrom" class="inp" value="'+st.from+'"></label><label class="f" for="mTo">bis<input type="date" id="mTo" class="inp" value="'+st.to+'"></label></div>'+
        '<h4>Ablauf (wiederholt sich ab „Gilt von“)</h4>'+
        st.blocks.map(([t,c],i)=>'<div class="mrow"><div class="mseg">'+["F","S","N","X"].map(k=>'<button type="button" class="mt'+(k===t?' on':'')+'" style="--c:'+MCOL[k]+';--ci:'+MINK[k]+'" data-bt="'+i+':'+k+'">'+MNAME[k]+'</button>').join("")+'</div>'+
          '<div class="mstep"><button type="button" data-bc="'+i+':-1" aria-label="Weniger">−</button><b>'+c+'</b><button type="button" data-bc="'+i+':1" aria-label="Mehr">+</button></div>'+
          '<button type="button" class="mdel" data-bd="'+i+'" aria-label="Block entfernen">✕</button></div>').join("")+
        '<button class="btn" data-a="badd">+ Block hinzufügen</button>'+
        '<p class="smeta">Zyklus: <b>'+len+' Tage</b> · '+["F","S","N"].map(k=>MNAME[k]+' '+pat.filter(x=>x===k).length).join(" · ")+' · Frei '+pat.filter(x=>x==="X").length+'</p>'+
        '<h4>Vorschau der ersten Wochen</h4><div class="pk mprev">'+prev+'</div>'+
        '<div class="err" id="mErr"></div>'+
        '<button class="btn primary" data-a="msave">Speichern</button>'+
        (idx>=0?'<button class="btn danger" data-a="mdel">'+(sure?'Wirklich löschen? Nochmal tippen':'Schichtmodell löschen')+'</button>':'')+
        '<button class="btn" data-a="mback">Zurück</button>';
    }
    sheet.hidden=false;scrim.hidden=false;render();
    sheet.onclick=ev=>{const T=ev.target;read();
      const bt=T.closest("[data-bt]"),bc=T.closest("[data-bc]"),bd=T.closest("[data-bd]"),a=T.closest("[data-a]")?.dataset.a;
      if(bt){const [i,k]=bt.dataset.bt.split(":");st.blocks[+i][0]=k;return render()}
      if(bc){const [i,d]=bc.dataset.bc.split(":").map(Number);st.blocks[i][1]=Math.max(1,Math.min(60,st.blocks[i][1]+d));return render()}
      if(bd){if(st.blocks.length>1)st.blocks.splice(+bd.dataset.bd,1);return render()}
      if(a==="badd"){const last=st.blocks[st.blocks.length-1];st.blocks.push([last&&last[0]==="X"?"F":"X",last&&last[0]==="X"?6:2]);return render()}
      if(a==="mback")return modelsSheet();
      if(a==="mdel"){if(!sure){sure=true;return render()}models.splice(idx,1);saveModels();repaintAll();toast("Schichtmodell gelöscht");return modelsSheet()}
      if(a==="msave"){const er=document.getElementById("mErr");
        if(!st.from||!st.to||parseIso(st.to)<parseIso(st.from)){er.textContent="Bitte ein gültiges Von- und Bis-Datum wählen. „Bis“ darf nicht vor „Von“ liegen.";return}
        if(!st.blocks.some(b=>b[0]!=="X")){er.textContent="Bitte mindestens einen Block mit Früh, Spät oder Nacht anlegen.";return}
        const clash=models.filter((m,i)=>i!==idx&&!(parseIso(m.to)<parseIso(st.from)||parseIso(m.from)>parseIso(st.to)));
        if(idx>=0)models[idx]=st; else models.push(st); saveModels(); repaintAll();
        toast(clash.length?"Gespeichert. Überschneidet sich mit „"+clash[0].name+"“, das neue gilt dort.":"Schichtmodell gespeichert");
        return modelsSheet()}
    };
    sheet.oninput=read;
  }

  // ---------- Partner: Plan per Link/QR teilen (ohne Server, Daten stecken im Link) ----------
  const APPURL="https://onkelstuka-droid.github.io/Schichtplan-/";
  const SHARE_T=["U","TZ","AG","SU"]; // Krank, Notizen, Überstunden werden nicht geteilt
  let partners=store.get("sp_partners",[]); const savePartners=()=>store.set("sp_partners",partners);
  let own=null;
  const b64u={enc:u8=>{let s="";for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")},
    dec:t=>{t=t.replace(/-/g,"+").replace(/_/g,"/");while(t.length%4)t+="=";const s=atob(t),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}};
  async function zip(u8,dir){const cs=dir?new CompressionStream("deflate-raw"):new DecompressionStream("deflate-raw");
    return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(cs)).arrayBuffer())}
  function packVac(v){ // zusammenhängende Tage gleicher Art als "U20500.5"
    const ks=Object.keys(v).map(Number).filter(n=>SHARE_T.includes(v[n])&&n>=TODAY-400).sort((a,b)=>a-b),out=[];
    for(let i=0;i<ks.length;){let j=i;while(j+1<ks.length&&ks[j+1]===ks[j]+1&&v[ks[j+1]]===v[ks[i]])j++;out.push(v[ks[i]]+ks[i]+(j>i?"."+(j-i+1):""));i=j+1}
    return out.join(",")}
  function unpackVac(s){const v={};(s||"").split(",").forEach(x=>{const m=/^(U|TZ|AG|SU)(\d+)(?:\.(\d+))?$/.exec(x);if(!m)return;for(let i=0;i<(+m[3]||1);i++)v[+m[2]+i]=m[1]});return v}
  async function makeLink(name){
    const src=own||{anchor,vac,models,quota,base};
    const d={v:1,n:name,b:src.base==="none"?0:1,a:iso(src.anchor),m:src.models.map(m=>({name:m.name,from:m.from,to:m.to,blocks:m.blocks})),e:packVac(src.vac),q:src.quota,t:Date.now()};
    const raw=new TextEncoder().encode(JSON.stringify(d));
    let code; try{code="1"+b64u.enc(await zip(raw,true))}catch(e){code="0"+b64u.enc(raw)}
    return APPURL+"#p="+code}
  async function readLink(txt){
    const m=/#p=([01])([\w-]+)/.exec(txt||""); if(!m)return null;
    try{let u=b64u.dec(m[2]); if(m[1]==="1")u=await zip(u,false);
      const d=JSON.parse(new TextDecoder().decode(u));
      if(!d||d.v!==1||!d.n||!/^\d{4}-\d\d-\d\d$/.test(d.a))return null;
      return {n:String(d.n).slice(0,40),a:d.a,m:Array.isArray(d.m)?d.m:[],e:d.e||"",q:Object.assign({U:30,TZ:8},d.q||{}),b:d.b===0?"none":"175",t:+d.t||Date.now()}}catch(e){return null}}
  const stand=t=>{const d=new Date(t);return d.getDate()+"."+(d.getMonth()+1)+"."+d.getFullYear()+", "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+" Uhr"};

  function showPartner(p){
    if(!PV)own={anchor,vac,models,notes,ot,quota,base,routines,bdays};
    PV=p; base=p.b||"175"; routines=[]; bdays=[]; anchor=parseIso(p.a); vac=unpackVac(p.e); models=p.m; notes={}; ot=[]; quota=p.q; mCache=null;
    document.body.classList.add("pv"); document.getElementById("pvBar").hidden=false;
    document.getElementById("pvName").textContent="👀 Plan von "+p.n;
    closeSheet(); repaintAll(); scrollToToday(false); toast("Du siehst jetzt den Plan von "+p.n);
  }
  function showOwn(){ if(!PV)return;
    PV=null; ({anchor,vac,models,notes,ot,quota,base,routines,bdays}=own); own=null; mCache=null;
    document.body.classList.remove("pv"); document.getElementById("pvBar").hidden=true;
    closeSheet(); if(!yv.hidden){yv.hidden=true;document.body.style.overflow=""} repaintAll(); scrollToToday(false);
  }
  document.getElementById("pvBack").onclick=showOwn;
  function pvDay(n){
    const s=shift(n),t=vt(n),ft=holiday(n);
    openSheet('<h3>'+fmt(n)+'</h3><p><b>Plan von '+esc(PV.n)+':</b> '+(t?TYPE[t].name+(s!=="X"?' (statt '+NAMES[s]+')':''):NAMES[s])+'</p>'+
      (ft?'<p><b style="color:var(--feiertag)">'+icon(n)+' Feiertag: '+ft+'</b></p>':special(n)?'<p>'+ICON[special(n)]+' '+special(n)+'</p>':'')+
      '<p class="pvnote">Den Plan von '+esc(PV.n)+' kannst du nur ansehen. Änderungen macht '+esc(PV.n)+' auf dem eigenen Handy und schickt dir einen neuen Link.</p>'+
      '<button class="btn primary" data-a="back">Zurück zu meinem Plan</button><button class="btn" data-a="close">Schließen</button>');
    sheet.onclick=e=>{const a=e.target.closest("[data-a]")?.dataset.a;if(a==="back")showOwn();if(a==="close")closeSheet()};
  }
  function savePartner(p){const i=partners.findIndex(x=>x.n===p.n);if(i>=0)partners[i]=p;else partners.push(p);savePartners()}

  function partnerSheet(){
    const my=store.get("sp_myname","");
    const list=partners.map((p,i)=>'<div class="pvitem"><div><b>'+esc(p.n)+'</b><small>Stand '+stand(p.t)+'</small></div><button data-pv="'+i+'">Ansehen</button><button data-pd="'+i+'" aria-label="Löschen">🗑️</button></div>').join("");
    openSheet('<h3>Partner</h3>'+
      (PV?'<button class="btn primary" data-a="back">Zurück zu meinem Plan</button><button class="btn" data-a="year">🗓️ Jahresübersicht von '+esc(PV.n)+'</button>':'')+
      (PV?'':'<h4>Meinen Plan teilen</h4><p class="pvnote">Dein Partner bekommt deine Schichten, Urlaub, TZ, Ausgleich und Sonderurlaub. Krankheitstage, Notizen und Überstunden bleiben privat.</p>'+
      '<label for="pvMy"><b>Dein Name</b> (so sieht ihn dein Partner)</label><input class="pvinp" id="pvMy" maxlength="40" placeholder="z. B. Hans-Jürgen" value="'+esc(my)+'">'+
      '<p id="pvErr" class="pvnote" style="color:var(--feiertag)"></p>'+
      '<button class="btn primary" data-a="wa">💬 Per WhatsApp senden</button>'+
      (navigator.share?'<button class="btn" data-a="share">📤 Teilen (SMS, E-Mail …)</button>':'')+
      '<button class="btn" data-a="qr">🔳 QR-Code zum Abscannen zeigen</button>'+
      '<button class="btn" data-a="copy">📋 Link kopieren</button>'+
      '<p class="pvnote">Hast du etwas geändert? Einfach noch einmal senden. Der neue Link ersetzt beim Partner den alten Stand.</p>')+
      '<h4>Pläne von anderen</h4>'+(list?'<div class="pvlist">'+list+'</div>':'<p class="pvnote">Noch keiner. Öffne den Link, den du bekommen hast, oder füge ihn hier ein:</p>')+
      '<input class="pvinp" id="pvPaste" placeholder="Empfangenen Link hier einfügen"><button class="btn" data-a="paste">Link übernehmen</button>'+
      '<button class="btn" data-a="close">Schließen</button>');
    const name=()=>{const v=(document.getElementById("pvMy").value||"").trim();if(!v){document.getElementById("pvErr").textContent="Bitte zuerst deinen Namen eintragen.";document.getElementById("pvMy").focus();return null}store.set("sp_myname",v);return v};
    const text=(n,l)=>"📅 Mein Schichtplan von "+n+"\nZum Öffnen antippen. Der Plan wird in deiner Schichtplan-App gespeichert:\n"+l;
    sheet.onclick=async e=>{
      const pv=e.target.closest("[data-pv]"),pd=e.target.closest("[data-pd]"),a=e.target.closest("[data-a]")?.dataset.a;
      if(pv)return showPartner(partners[+pv.dataset.pv]);
      if(pd){const i=+pd.dataset.pd;if(pd.dataset.sure!=="1"){pd.dataset.sure="1";pd.textContent="Sicher?";return}
        const nm=partners[i].n;partners.splice(i,1);savePartners();if(PV&&PV.n===nm)showOwn();partnerSheet();toast("Plan von "+nm+" gelöscht");return}
      if(a==="close")return closeSheet();
      if(a==="back")return showOwn();
      if(a==="year"){closeSheet();return openYear(viewYear)}
      if(a==="paste"){const p=await readLink(document.getElementById("pvPaste").value);if(!p)return toast("Das ist kein gültiger Schichtplan-Link.");return receive(p)}
      if(!["wa","share","qr","copy"].includes(a))return;
      const n=name();if(!n)return; const link=await makeLink(n);
      if(a==="wa"){location.href="https://wa.me/?text="+encodeURIComponent(text(n,link));return}
      if(a==="share"){try{await navigator.share({title:"Schichtplan von "+n,text:text(n,link)})}catch(err){}return}
      if(a==="copy"){try{await navigator.clipboard.writeText(link);toast("Link kopiert")}catch(err){prompt("Link kopieren:",link)}return}
      if(a==="qr"){let svg="";try{const q=qrcode(0,"L");q.addData(link,"Byte");q.make();svg=q.createSvgTag({cellSize:4,margin:4,scalable:true})}catch(err){}
        openSheet('<h3>QR-Code</h3>'+(svg?'<div class="pvqr">'+svg+'</div><p class="pvnote">Dein Partner öffnet die Kamera-App, hält sie auf den Code und tippt auf den Link, der erscheint.</p>':'<p>Der Plan ist zu groß für einen QR-Code. Bitte den Link per WhatsApp schicken.</p>')+
          '<button class="btn" data-a="bk">Zurück</button>');
        sheet.onclick=e2=>{if(e2.target.closest("[data-a]"))partnerSheet()}}
    };
  }
  function receive(p){
    const old=partners.find(x=>x.n===p.n);
    const ios=/iPhone|iPad|iPod/.test(navigator.userAgent)&&!navigator.standalone;
    openSheet('<h3>Plan empfangen</h3><p>📲 <b>Schichtplan von '+esc(p.n)+'</b><br>Stand '+stand(p.t)+'</p>'+
      (old?'<p class="pvnote">Ersetzt den bisherigen Stand vom '+stand(old.t)+'.</p>':'')+
      '<p class="pvnote">Dein eigener Plan bleibt unverändert. Der Plan von '+esc(p.n)+' kommt als eigene Ansicht dazu.</p>'+
      '<button class="btn primary" data-a="ok">Speichern und ansehen</button><button class="btn" data-a="no">Nicht speichern</button>');
    sheet.onclick=e=>{const a=e.target.closest("[data-a]")?.dataset.a;
      if(a==="no")return closeSheet();
      if(a==="ok"){savePartner(p);showPartner(p);
        if(ios)setTimeout(()=>{openSheet('<h3>Hinweis fürs iPhone</h3><p>Der Plan ist jetzt in Safari gespeichert. Wenn du die App vom Home-Bildschirm benutzt, kopiere den Link aus WhatsApp und füge ihn dort ein: Menü ☰ → Partner → „Link übernehmen“.</p><button class="btn" data-a="x">Verstanden</button>');sheet.onclick=()=>closeSheet()},600)}};
  }
  if(/#p=/.test(location.hash)){const h=location.hash;history.replaceState(null,"",location.pathname+location.search);
    readLink(h).then(p=>{if(p)setTimeout(()=>receive(p),400);else toast("Der Link ist unvollständig. Bitte noch einmal schicken lassen.")})}
})();

</script>
